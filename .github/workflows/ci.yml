name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Cache pinned gtag
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: e2e/stubs/gtag.pinned.js
          key: pinned-gtag-${{ hashFiles('e2e/stubs/gtag.pinned.js.sha256') }}

      - name: Fetch pinned gtag
        run: node e2e/fetch-pinned-gtag.mjs

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: true
